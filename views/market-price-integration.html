<h2>Market Price Integration</h2>
<div>
    <input type="text" id="google-sheet-url" placeholder="Enter Google Sheet URL or ID" class="google-sheet-url-input" value="https://docs.google.com/spreadsheets/d/10E5D6og6lQ2P19PTRheXTvaRIE8WvYjVk0rogGO4iMY/edit?gid=0#gid=0">
    <button id="load-sheet-button" class="button-padding-8px-15px">Load Data</button>
    <button id="force-reload-sheet-button" class="button-margin-left-10px">Force Reload</button>
</div>
<div class="margin-top-10px">
    <button id="export-csv-button" class="button-padding-8px-15px">Export as CSV</button>
    <button id="import-csv-button" class="button-margin-left-10px">Import CSV</button>
    <input type="file" id="csv-file-input" accept=".csv" class="display-none">
</div>
<div id="sheet-status" class="sheet-status-style"></div>
<div id="sheet-data-display" class="margin-top-20px"></div>
